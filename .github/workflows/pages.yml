name: Deploy model viewer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate model geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path("tools").glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Python source syntax passed.")
          PY
          python -B tools/validate_model.py
      - name: Validate shell overlap cleanup
        run: python -B tools/remove_duplicate_shell_faces.py --check
      - name: Validate through-wall opening clearance
        run: python -B tools/validate_openings.py
      - name: Compare apartment floors against original
        run: python -B tools/compare_apartment_column.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
